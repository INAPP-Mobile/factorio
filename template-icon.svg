<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- big gear: outer teeth (12 teeth around 360) -->
  <g transform="translate(128 128)">
    <!-- 12-tooth gear, drawn as 12 rounded rectangles arranged radially -->
    <g fill="url(#gear)">
      <rect x="-10" y="-86" width="20" height="28" rx="4"/>
      <g transform="rotate(30)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(60)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(90)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(120)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(150)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(180)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(210)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(240)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(270)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(300)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
      <g transform="rotate(330)"><rect x="-10" y="-86" width="20" height="28" rx="4"/></g>
    </g>
    <!-- inner disk -->
    <circle r="60" fill="url(#gear)"/>
    <!-- center hub -->
    <circle r="22" fill="#1a1f2e"/>
    <!-- 4 bolt holes in the gear face for industrial feel -->
    <circle cx="0" cy="-38" r="7" fill="#1a1f2e"/>
    <circle cx="38" cy="0" r="7" fill="#1a1f2e"/>
    <circle cx="0" cy="38" r="7" fill="#1a1f2e"/>
    <circle cx="-38" cy="0" r="7" fill="#1a1f2e"/>
  </g>
  <!-- small second gear, lower-right, interlocking visual -->
  <g transform="translate(200 200)">
    <g fill="#94a3b8">
      <rect x="-6" y="-38" width="12" height="14" rx="2"/>
      <g transform="rotate(60)"><rect x="-6" y="-38" width="12" height="14" rx="2"/></g>
      <g transform="rotate(120)"><rect x="-6" y="-38" width="12" height="14" rx="2"/></g>
      <g transform="rotate(180)"><rect x="-6" y="-38" width="12" height="14" rx="2"/></g>
      <g transform="rotate(240)"><rect x="-6" y="-38" width="12" height="14" rx="2"/></g>
      <g transform="rotate(300)"><rect x="-6" y="-38" width="12" height="14" rx="2"/></g>
    </g>
    <circle r="26" fill="#94a3b8"/>
    <circle r="10" fill="#1a1f2e"/>
  </g>
</svg>
